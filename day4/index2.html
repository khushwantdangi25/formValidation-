<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Dom traversal</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color:white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
        }
        body{
            background:rgb(131, 131, 131);

        }

        .control{
            display: flex;

            width: 200px;

            border: none;

        .card{

        }

        }

        }

</head>
