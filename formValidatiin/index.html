<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="myForm">
        <h1>Student Registration Form</h1>

        <input type="text" id="email" placeholder="Email">

        <h1 id="message"></h1>
    </form>
    <script src="script.js"></script>
</body>
</html>
